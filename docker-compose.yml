services:
  postgres:
    image: postgres:17-alpine
    container_name: scholar-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar_password
      POSTGRES_DB: scholar_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: