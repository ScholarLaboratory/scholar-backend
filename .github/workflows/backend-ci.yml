name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/question-bank-api]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholar
          POSTGRES_PASSWORD: scholar_test
          POSTGRES_DB: scholar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholar -d scholar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scholar:scholar_test@localhost:5432/scholar_test?schema=public
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run build
      - run: pnpm test -- --runInBand
